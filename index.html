<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png" />
    <link rel="stylesheet" href="style.css" />

    <title>Frontend Mentor | Product preview card component</title>
  </head>
  <body>
    <main class="container">
      <section class="left-side">
        <picture>
          <source
            media="(max-width: 40rem)"
            srcset="images/image-product-mobile.jpg" />

          <img
            src="images/image-product-desktop.jpg"
            alt="Bottle of Gabrielle Essence Eau De Parfum next to green leaves" />
        </picture>
      </section>
      <section class="card">
        <p class="perfume">Perfume</p>

        <h1>Gabrielle Essence Eau De Parfum</h1>
        <p class="description">
          A floral, solar and voluptuous interpretation composed by Olivier
          Polge, Perfumer-Creator for the House of CHANEL.
        </p>

        <article class="price-box">
          <span class="price-current">$149.99</span>
          <span class="price-old">$169.99</span>
        </article>
        <button type="submit">
          <img src="images/icon-cart.svg" alt="cart-shopping" />
          Add to Cart
        </button>
      </section>
    </main>

    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge" target="_blank"
        >Frontend Mentor</a
      >. Coded by
      <a href="https://github.com/ErgunAtay" target="_blank"
        >Ergün Atay(Niftyy)</a
      >.
    </footer>
  </body>
</html>
